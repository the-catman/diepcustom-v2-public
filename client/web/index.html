<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>diep.io</title>
        <link rel="icon" type="image/png" href="favicon/favicon-16x16.png" sizes="16x16">
        <link rel="icon" type="image/png" href="favicon/favicon-32x32.png" sizes="32x32">
        <link rel="icon" type="image/png" href="favicon/favicon-96x96.png" sizes="96x96">
        <link href="https://fonts.googleapis.com/css?family=Ubuntu:700" rel="stylesheet" type="text/css">
        <style>
            html, body { margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%; background: #000000; }
            canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
            #canvas { z-index: 0; cursor: default; outline: none; }
            #world { z-index: 1; display: none; pointer-events: none; }
            #overlay { z-index: 2; display: none; pointer-events: none; }
            #loading {
                color: #ffffff;
                position: absolute;
                z-index: 3;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                font-size: 48pt;
                font-family: sans-serif;
                font-weight: bold;
                cursor: default;
            }
        </style>
    </head>
    <body>
        <span id="loading">Loading...</span>
        <canvas id="canvas" oncontextmenu="if (window.preventRightClick) event.preventDefault()"></canvas>
        <canvas id="world"></canvas>
        <canvas id="overlay"></canvas>
        <div style="font-family:'Ubuntu';position:absolute;visibility:hidden">&nbsp;</div>
        <script>
            // Changelog lines shown at the top left until the first spawn (diepcustom's default).
            window.changelog = [
                "Updated recently",
                "",
                "Check out the GitHub repository!: github.com/ABCxFF/diepcustom",
                "Join our Discord server: discord.gg/SyxWdxgHnT :)"
            ];
        </script>
        <script src="client.js"></script>
    </body>
</html>
