<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Duel replay</title>
<style>
  body { margin: 0; background: #1e1e1e; color: #ddd; font: 13px sans-serif; }
  #bar { display: flex; gap: 10px; align-items: center; padding: 6px 10px; }
  #scrub { flex: 1; }
  canvas { display: block; margin: 0 auto; background: #cdcdcd; }
</style>
</head>
<body>
<div id="bar">
  <button id="play">pause</button>
  <label>speed <select id="speed"><option>0.5</option><option selected>1</option><option>2</option><option>4</option></select></label>
  <input id="scrub" type="range" min="0" value="0">
  <span id="info"></span>
</div>
<canvas id="c"></canvas>
<script>
const DATA = /*DATA*/null;
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
const scrub = document.getElementById('scrub'), info = document.getElementById('info');
const frames = DATA.frames, half = DATA.arena / 2;
scrub.max = frames.length - 1;
document.title = DATA.title;
let at = 0, playing = true, last = performance.now();
// One frame per decision: 4 ticks at 25 per second.
const FPS = 25 / 4;
document.getElementById('play').onclick = e => { playing = !playing; e.target.textContent = playing ? 'pause' : 'play'; };
scrub.oninput = () => { at = +scrub.value; };
function resize() {
  const s = Math.min(innerWidth, innerHeight - 40);
  canvas.width = canvas.height = s;
}
addEventListener('resize', resize); resize();
const COLORS = ['#00b2e1', '#f14e54'];
// Shapes by their number of sides.
const SHAPE_COLORS = {3: '#fc7677', 4: '#ffe869', 5: '#768dfc'};
// Each side's barrels in the tank's frame: x, y, angle, length, width, is trapezoid.
const BARRELS = DATA.barrels || [0, 1].map(() => null);
function drawBarrels(list, x, y, ang, rad) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
  ctx.fillStyle = '#999'; ctx.strokeStyle = '#727272'; ctx.lineWidth = 7;
  if (!list) list = [[rad * 0.95, 0, 0, rad * 1.9, rad * 0.84, false]];
  for (const [bx, by, ba, len, w, trap] of list) {
    ctx.save(); ctx.translate(bx, by); ctx.rotate(ba);
    ctx.beginPath();
    if (trap) {
      ctx.moveTo(-len / 2, -w / 2); ctx.lineTo(len / 2, -w * 0.875);
      ctx.lineTo(len / 2, w * 0.875); ctx.lineTo(-len / 2, w / 2); ctx.closePath();
    } else {
      ctx.rect(-len / 2, -w / 2, len, w);
    }
    ctx.fill(); ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}
function draw() {
  const s = canvas.width / (DATA.arena + 600);
  const i = Math.floor(at), f = at - i;
  const a = frames[i], b = frames[Math.min(i + 1, frames.length - 1)];
  const next = new Map();
  if (b.e === a.e) for (const r of b.d) next.set(r[7], r);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(s, 0, 0, s, canvas.width / 2, canvas.height / 2);
  ctx.fillStyle = '#b8b8b8';
  ctx.fillRect(-half - 300, -half - 300, DATA.arena + 600, DATA.arena + 600);
  ctx.fillStyle = '#cdcdcd';
  ctx.fillRect(-half, -half, DATA.arena, DATA.arena);
  ctx.strokeStyle = 'rgba(0,0,0,0.08)'; ctx.lineWidth = 2;
  for (let g = -half; g <= half; g += 100) {
    ctx.beginPath(); ctx.moveTo(g, -half); ctx.lineTo(g, half); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-half, g); ctx.lineTo(half, g); ctx.stroke();
  }
  const rows = a.d.slice().sort((p, q) => q[3] - p[3]);
  for (const r of rows) {
    const n = next.get(r[7]);
    const x = n ? r[0] + (n[0] - r[0]) * f : r[0], y = n ? r[1] + (n[1] - r[1]) * f : r[1];
    let ang = r[5];
    if (n) { let d = n[5] - r[5]; d = Math.atan2(Math.sin(d), Math.cos(d)); ang += d * f; }
    const rad = r[2], shape = r[3] >= 3, color = shape ? SHAPE_COLORS[r[3]] : COLORS[r[4]];
    if (!r[3]) drawBarrels(BARRELS[r[4]], x, y, ang, rad);
    ctx.beginPath();
    if (shape) {
      for (let k = 0; k < r[3]; ++k) {
        const t = ang + k * Math.PI * 2 / r[3];
        ctx.lineTo(x + Math.cos(t) * rad, y + Math.sin(t) * rad);
      }
      ctx.closePath();
    } else if (r[3] === 2) {
      // Drones are triangles pointing where they fly.
      for (let k = 0; k < 3; ++k) {
        const t = ang + k * Math.PI * 2 / 3;
        ctx.lineTo(x + Math.cos(t) * rad, y + Math.sin(t) * rad);
      }
      ctx.closePath();
    } else {
      ctx.arc(x, y, rad, 0, Math.PI * 2);
    }
    ctx.fillStyle = color; ctx.fill();
    ctx.lineWidth = 7; ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.stroke();
    if (!r[3] || (shape && r[6] < 1)) {
      ctx.fillStyle = '#555'; ctx.fillRect(x - rad, y + rad + 15, rad * 2, 12);
      ctx.fillStyle = '#85e37d'; ctx.fillRect(x - rad, y + rad + 15, rad * 2 * r[6], 12);
    }
  }
  // Drone classes' mice: a dot while attracting, a cross while repelling, a faint ring otherwise.
  for (const [k, m] of (a.m || []).entries()) {
    if (!m || Math.abs(m[0]) > half + 300 || Math.abs(m[1]) > half + 300) continue;
    ctx.strokeStyle = COLORS[k]; ctx.fillStyle = COLORS[k]; ctx.lineWidth = 6;
    ctx.globalAlpha = m[2] ? 0.9 : 0.35;
    ctx.beginPath(); ctx.arc(m[0], m[1], 30, 0, Math.PI * 2); ctx.stroke();
    if (m[2] > 0) { ctx.beginPath(); ctx.arc(m[0], m[1], 12, 0, Math.PI * 2); ctx.fill(); }
    if (m[2] < 0) {
      ctx.beginPath();
      ctx.moveTo(m[0] - 40, m[1] - 40); ctx.lineTo(m[0] + 40, m[1] + 40);
      ctx.moveTo(m[0] + 40, m[1] - 40); ctx.lineTo(m[0] - 40, m[1] + 40);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  const result = DATA.results[a.e] || '';
  info.textContent = `${DATA.title}  episode ${a.e + 1}/${DATA.results.length} (${result})  frame ${i + 1}/${frames.length}`;
  scrub.value = i;
}
function loop(now) {
  const dt = Math.max(0, (now - last) / 1000); last = now;
  if (playing) at = Math.max(0, Math.min(at + dt * FPS * +document.getElementById('speed').value, frames.length - 1));
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
