services:
  server:
    ports: !reset []
    networks: [game]
    environment:
      TRUST_PROXY: "1"

  proxy:
    image: caddy:2.11.9-alpine
    depends_on: [server]
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [game, web]
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 64
    restart: unless-stopped

networks:
  game:
    internal: true
  web:

volumes:
  caddy_data:
  caddy_config:
