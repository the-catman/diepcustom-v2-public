services:
  server:
    build: .
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      DEV_PASSWORD_HASH: ${DEV_PASSWORD_HASH:-}
    ports:
      - "${GAME_PORT:-8080}:8080"
    mem_limit: 1g
    pids_limit: 64
    cpus: 2
    restart: unless-stopped
