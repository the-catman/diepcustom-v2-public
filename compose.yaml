services:
  server:
    build: .
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      TRUST_PROXY: "1"
      DEV_PASSWORD_HASH: ${DEV_PASSWORD_HASH:-}
    mem_limit: 1g
    pids_limit: 64
    cpus: 2
    restart: unless-stopped

  proxy:
    image: caddy:2.11.9-alpine
    depends_on: [server]
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 64
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
